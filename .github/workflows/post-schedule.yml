name: Chi'Ella daily post

on:
  schedule:
    # Nigeria is WAT = UTC+1, no DST
    - cron: "0 7 * * *"    # 08:00 WAT — morning
    - cron: "0 12 * * *"   # 13:00 WAT — afternoon
    - cron: "0 18 * * *"   # 19:00 WAT — evening
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, afternoon, or evening"
        required: false
        default: "morning"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Determine slot from cron time
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
              "0 12 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python scripts/post_today.py ${{ steps.slot.outputs.slot }}
