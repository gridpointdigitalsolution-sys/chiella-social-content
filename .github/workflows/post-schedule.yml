name: Chi'Ella daily post

on:
  schedule:
    # Nigeria is WAT = UTC+1, no DST
    # Fire ~2h early; job sleeps until the exact target so GitHub queue delays don't matter
    - cron: "0 5 * * *"    # posts 08:00 WAT — morning
    - cron: "0 10 * * *"   # posts 13:00 WAT — afternoon
    - cron: "0 16 * * *"   # posts 19:00 WAT — evening
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, afternoon, or evening"
        required: false
        default: "morning"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Determine slot from cron time
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT"; echo "target=07:00" >> "$GITHUB_OUTPUT" ;;
              "0 10 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT"; echo "target=12:00" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=evening" >> "$GITHUB_OUTPUT"; echo "target=18:00" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Wait until exact posting time
        if: steps.slot.outputs.target != ''
        run: |
          NOW=$(date -u +%s)
          TGT=$(date -u -d "$(date -u +%F) ${{ steps.slot.outputs.target }}" +%s)
          if [ "$TGT" -gt "$NOW" ]; then sleep $((TGT-NOW)); fi
      - name: Post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python scripts/post_today.py ${{ steps.slot.outputs.slot }}
